name: Spor Etkinlikleri Otomatik Guncelleme

on:
  schedule:
    # Turkiye Saati (UTC+3): 07:10, 10:10, 13:10, 16:10, 20:10
    # UTC Karsiligi: 04:10, 07:10, 10:10, 13:10, 17:10
    - cron: '10 4,7,10,13,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Spor Etkinliklerini Topla
        run: python scripts/veri_topla.py

      - name: Etkinlik Kayitlari ve maclar.txt Degisikligini Kontrol Et ve Pushla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f maclar.txt data/etkinlikler.json
          if git diff --staged --quiet; then
            echo "Etkinlik kayıtlarında ve maclar.txt dosyasında değişiklik yok. Commit atılmadı."
          else
            git commit -m "chore(spor): etkinlik kayıtları ve maclar.txt güncellendi [skip ci]"
            git push
          fi

