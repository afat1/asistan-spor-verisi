name: Spor kodu testleri

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'main.py', 'requirements.txt', '.github/workflows/spor_etkinlikleri_guncelle.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asistan-sports-code-tests
  cancel-in-progress: false

jobs:
  test:
    # Standard GitHub-hosted runners are free for public repositories.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fikstür doğrulama testleri
        run: python -m unittest discover -s tests



